name: scan

on:
  schedule:
    - cron: "3-59/10 * * * *" # off the round minutes, where GitHub's scheduler is busiest and drops runs
  workflow_dispatch:          # "Run now" on the dashboard, or manually from the Actions tab
    inputs:
      dry_run:
        description: "Print matches instead of alerting; uses a throwaway database"
        type: boolean
        default: false

concurrency:                  # never two scans at once (a manual run waits for a scheduled one)
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    # Scheduled runs only once the repo variable SCAN_ENABLED=true (set at cutover from the laptop).
    if: github.event_name == 'workflow_dispatch' || vars.SCAN_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: uv run --frozen rentbot run --sources rightmove,onthemarket,bristolreslet${{ inputs.dry_run && ' --dry-run' || '' }}
      - name: Tell admin the job itself failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_ADMIN_CHAT_ID}" \
            --data-urlencode "text=⚠️ rentbot: GitHub Actions scan job failed: ${RUN_URL}" > /dev/null
