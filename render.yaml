# Render Blueprint: the dashboard, which also scans when cron-job.org calls /api/scan (see schedule in config.yaml)
# (the calls also keep the free instance awake).
services:
  - type: web
    name: rentbot-dashboard
    runtime: python
    plan: free
    region: frankfurt          # next to the Neon database (eu-central-1)
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --frozen --no-dev rentbot dashboard
    healthCheckPath: /healthz   # not /api/state: health checks run every few seconds and would query Neon each time
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.13
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: SCAN_TOKEN         # bearer token cron-job.org sends to /api/scan
        sync: false
